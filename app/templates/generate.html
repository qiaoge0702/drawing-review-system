<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图纸生成系统 - 专用车辆上装设计图纸智能系统</title>
    <style>
        :root {
            --bg: #f0f4f8; --surface: #ffffff;
            --primary: #3b82f6; --primary-light: #dbeafe; --primary-dark: #2563eb;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
            --text: #1e293b; --text-secondary: #64748b; --text-light: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --radius: 12px; --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
        }
        .topbar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 12px 24px; display: flex; align-items: center; gap: 24px;
        }
        .topbar h1 { font-size: 18px; }
        .topbar nav a { color: var(--text-secondary); text-decoration: none; margin-right: 16px; }
        .topbar nav a.active { color: var(--primary); font-weight: 600; }
        #ws-status { margin-left: auto; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
        .ws-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .ws-dot.on { background: var(--success); }
        .ws-dot.off { background: var(--text-light); }

        .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px 24px; max-width: 1600px; margin: 0 auto; }
        .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }

        /* 创建任务 */
        .create-form label { font-size: 13px; color: var(--text-secondary); display: block; margin: 10px 0 4px; }
        .create-form input, .create-form select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 14px;
        }
        .btn {
            background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm);
            padding: 8px 18px; font-size: 14px; cursor: pointer; margin-top: 12px;
        }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { background: var(--text-light); cursor: not-allowed; }
        .btn-sm { padding: 4px 12px; font-size: 13px; margin-top: 0; }
        .btn-link { background: none; color: var(--primary); padding: 4px 8px; margin-top: 0; }

        /* 步骤导航 */
        .step-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 4px;
        }
        .step-item:hover { background: var(--bg); }
        .step-item.active { background: var(--primary-light); }
        .step-icon { font-size: 16px; }
        .step-title { font-size: 14px; font-weight: 500; }
        .step-sub { font-size: 12px; color: var(--text-secondary); }

        /* 进度 */
        .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.4s; }
        .progress-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }

        /* 主内容 */
        .empty { color: var(--text-light); text-align: center; padding: 60px 0; }
        .kv { border-collapse: collapse; width: 100%; }
        .kv td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .kv td:first-child { color: var(--text-secondary); width: 120px; }
        .step-header { display: flex; align-items: center; justify-content: space-between; }
        .step-status-line { font-size: 13px; color: var(--text-secondary); margin: 8px 0 12px; }
        .error-text { color: var(--danger); font-size: 13px; margin: 8px 0; word-break: break-all; }
        .json-view {
            background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: var(--radius-sm);
            font-size: 12px; max-height: 400px; overflow: auto;
        }
        .artifact-list { list-style: none; margin: 8px 0 16px; }
        .artifact-list li { padding: 4px 0; font-size: 14px; }
        .artifact-img { max-width: 320px; display: block; margin: 6px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .muted { color: var(--text-light); font-size: 13px; }
        h4 { margin: 14px 0 6px; font-size: 14px; }

        /* 历史 */
        .history-item {
            display: flex; gap: 10px; align-items: center; padding: 8px 10px;
            border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
        }
        .history-item:hover { background: var(--bg); }
        .history-id { font-family: monospace; }
        .status-completed { color: var(--success); }
        .status-error { color: var(--danger); }
        .status-running, .status-queued { color: var(--warning); }
        .section-title { font-size: 14px; font-weight: 600; margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: center; }

        /* 步骤回放时间线 */
        .timeline-section-title { font-size: 15px; font-weight: 600; margin: 22px 0 10px; }
        .timeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .timeline-card {
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 10px; background: var(--surface);
        }
        .timeline-card.status-running { border-color: var(--warning); }
        .timeline-card.status-completed { border-color: var(--success); }
        .timeline-card.status-error { border-color: var(--danger); }
        .timeline-head { display: flex; align-items: center; gap: 6px; }
        .timeline-title { font-size: 13px; font-weight: 600; }
        .timeline-sub { font-size: 12px; color: var(--text-secondary); margin: 4px 0 8px; }
        .snapshot-thumb {
            width: 100%; height: 160px; object-fit: contain; background: #f8fafc;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            cursor: zoom-in; display: block;
        }
        .snapshot-placeholder {
            height: 160px; display: flex; align-items: center; justify-content: center;
            color: var(--text-light); font-size: 13px; background: #f8fafc;
            border: 1px dashed var(--border); border-radius: var(--radius-sm);
        }

        /* 终图卡片 */
        .final-card { margin-top: 8px; }
        .final-snap { height: 320px; }
        .final-links { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .final-dl { text-decoration: none; display: inline-block; }

        /* 阶段产物页 */
        .stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
        .stage-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--surface); }
        .stage-card.status-running { border-color: var(--warning); }
        .stage-card.status-completed { border-color: var(--success); }
        .stage-card.status-error { border-color: var(--danger); }
        .stage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .stage-title { font-size: 15px; font-weight: 600; }
        .stage-sub { font-size: 12px; color: var(--text-secondary); }
        .stage-status { font-size: 13px; margin-bottom: 12px; }
        .stage-body { font-size: 13px; }
        .stage-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
        .stage-empty { color: var(--text-light); text-align: center; padding: 24px 0; border: 1px dashed var(--border); border-radius: var(--radius-sm); background: #f8fafc; }
        .stage-dl dt { color: var(--text-secondary); margin-top: 8px; }
        .stage-dl dd { margin-left: 0; word-break: break-all; }
        .stage-main-snap { height: 240px; margin-bottom: 10px; }
        .stage-downloads { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .stage-report { max-height: 240px; }

        /* 步骤明细折叠区 */
        .stage-details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
        .details-toggle { font-size: 13px; color: var(--primary); cursor: pointer; user-select: none; }
        .details-toggle:hover { text-decoration: underline; }
        .details-content.hidden { display: none; }
        .details-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .detail-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
        .detail-item.status-completed { border-left: 3px solid var(--success); }
        .detail-item.status-error { border-left: 3px solid var(--danger); }
        .detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .detail-status { font-size: 14px; }
        .detail-name { font-weight: 600; }
        .detail-meta { color: var(--text-secondary); font-size: 12px; margin-left: auto; }
        .detail-snap { width: 100%; height: 140px; object-fit: contain; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: zoom-in; display: block; }
        .detail-version { margin-top: 6px; }
        .detail-version a { font-size: 12px; }

        /* BOM 表 */
        .bom-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
        .bom-table th, .bom-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
        .bom-table th { background: var(--bg); font-weight: 600; }
        .bom-table tr.external-part { background: #fff7e6; }

        /* 技术要求 */
        .tech-block { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
        .tech-title { font-weight: 600; margin-bottom: 6px; }
        .tech-content { font-family: monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin: 0; }

        /* 大图灯箱 */
        .lightbox {
            position: fixed; inset: 0; background: rgba(15,23,42,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; cursor: zoom-out;
        }
        .lightbox.hidden { display: none; }
        .lightbox img { max-width: 92vw; max-height: 92vh; background: #fff; border-radius: var(--radius-sm); }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>图纸生成系统</h1>
        <nav>
            <a href="/">审查系统</a>
            <a href="/generate" class="active">生成系统</a>
        </nav>
        <div id="ws-status"></div>
    </div>

    <div id="lightbox" class="lightbox hidden"><img alt="快照原图"></div>

    <div class="layout">
        <!-- 左侧栏 -->
        <div>
            <div class="panel">
                <div class="section-title">新建生成任务</div>
                <div class="create-form">
                    <label>SW 文件路径（.SLDASM / .SLDPRT）</label>
                    <input id="source-file" type="text" placeholder="E:\path\to\model.SLDASM">
                    <button id="btn-create" class="btn">创建任务</button>
                </div>
            </div>

            <div class="panel" style="margin-top:16px">
                <div class="section-title">
                    步骤导航
                    <button id="btn-overview" class="btn btn-link">总览</button>
                </div>
                <div id="progress-area"></div>
                <div id="step-nav"></div>
            </div>

            <div class="panel" style="margin-top:16px">
                <div class="section-title">
                    历史任务
                    <button id="btn-refresh-history" class="btn btn-link">刷新</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="panel" id="main-content"></div>
    </div>

    <script type="module" src="/static/generate/js/main.js"></script>
</body>
</html>
